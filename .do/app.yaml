name: replication-triage
services:
  - name: web
    source_dir: /
    environment_slug: python
    instance_size_slug: basic-xs
    instance_count: 1
    http_port: 8080
    run_command: PYTHONPATH=src uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envs:
      - key: DATABASE_URL
        value: ${replication-db.DATABASE_URL}
        scope: RUN_TIME
      - key: AUTO_PROCESS_ON_SUBMIT
        value: "0"
        scope: RUN_TIME
      - key: MAX_TOTAL_USD
        value: "250"
        scope: RUN_TIME
      - key: MAX_SAMPLE_SIZE
        value: "500"
        scope: RUN_TIME
      - key: MAX_UPLOAD_MB
        value: "15"
        scope: RUN_TIME
      - key: MAX_TEXT_CHARS
        value: "300000"
        scope: RUN_TIME
      - key: MAX_QUEUED_JOBS
        value: "50"
        scope: RUN_TIME
      - key: MAX_BATCH_IMPORT
        value: "50"
        scope: RUN_TIME
      - key: CACHE_DIR
        value: /tmp/replication-cache
        scope: RUN_TIME
      - key: BULK_IMPORT_RESOLVE
        value: "1"
        scope: RUN_TIME
      - key: BULK_IMPORT_MULTISOURCE
        value: "1"
        scope: RUN_TIME
      - key: BULK_IMPORT_OVERFETCH_FACTOR
        value: "4"
        scope: RUN_TIME
      - key: BULK_IMPORT_MIN_FULLTEXT_CHARS
        value: "600"
        scope: RUN_TIME
      - key: BULK_IMPORT_MAX_BYTES
        value: "31457280"
        scope: RUN_TIME
      - key: LLM_SIMULATION_ENABLED
        value: "0"
        scope: RUN_TIME
      - key: LLM_BASE_URL
        value: https://inference.do-ai.run
        scope: RUN_TIME
      - key: LLM_MODEL
        value: llama3.3-70b-instruct
        scope: RUN_TIME
      - key: LLM_SAMPLE_SIZE
        value: "40"
        scope: RUN_TIME
      - key: LLM_PRIMARY_ONLY
        value: "1"
        scope: RUN_TIME
      - key: LLM_MAX_TOKENS
        value: "180"
        scope: RUN_TIME
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
        scope: RUN_TIME
workers:
  - name: worker
    source_dir: /
    environment_slug: python
    instance_size_slug: basic-xs
    instance_count: 1
    run_command: PYTHONPATH=src python -m worker.main
    envs:
      - key: DATABASE_URL
        value: ${replication-db.DATABASE_URL}
        scope: RUN_TIME
      - key: AUTO_PROCESS_ON_SUBMIT
        value: "0"
        scope: RUN_TIME
      - key: MAX_TOTAL_USD
        value: "250"
        scope: RUN_TIME
      - key: MAX_SAMPLE_SIZE
        value: "500"
        scope: RUN_TIME
      - key: MAX_UPLOAD_MB
        value: "15"
        scope: RUN_TIME
      - key: MAX_TEXT_CHARS
        value: "300000"
        scope: RUN_TIME
      - key: MAX_QUEUED_JOBS
        value: "50"
        scope: RUN_TIME
      - key: MAX_BATCH_IMPORT
        value: "50"
        scope: RUN_TIME
      - key: CACHE_DIR
        value: /tmp/replication-cache
        scope: RUN_TIME
      - key: BULK_IMPORT_RESOLVE
        value: "1"
        scope: RUN_TIME
      - key: BULK_IMPORT_MULTISOURCE
        value: "1"
        scope: RUN_TIME
      - key: BULK_IMPORT_OVERFETCH_FACTOR
        value: "4"
        scope: RUN_TIME
      - key: BULK_IMPORT_MIN_FULLTEXT_CHARS
        value: "600"
        scope: RUN_TIME
      - key: BULK_IMPORT_MAX_BYTES
        value: "31457280"
        scope: RUN_TIME
      - key: LLM_SIMULATION_ENABLED
        value: "0"
        scope: RUN_TIME
      - key: LLM_BASE_URL
        value: https://inference.do-ai.run
        scope: RUN_TIME
      - key: LLM_MODEL
        value: llama3.3-70b-instruct
        scope: RUN_TIME
      - key: LLM_SAMPLE_SIZE
        value: "40"
        scope: RUN_TIME
      - key: LLM_PRIMARY_ONLY
        value: "1"
        scope: RUN_TIME
      - key: LLM_MAX_TOKENS
        value: "180"
        scope: RUN_TIME
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
        scope: RUN_TIME
databases:
  - name: replication-db
    engine: PG
    version: "16"
    production: false
